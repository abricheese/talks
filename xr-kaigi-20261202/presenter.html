<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR Kaigi 発表者</title>
<style>
:root { --bg:#070b10; --panel:#0e1a21; --line:#1e3440; --ink:#eef7f5; --sub:#93aab0; --teal:#7fe3c4; --warm:#ffc46b; --bad:#ff7b7b;
  --font: "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","BIZ UDPGothic",Meiryo,sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); height: 100vh; overflow: hidden; }
header, main, footer { min-width: 0; }
button { font: inherit; color: inherit; background: #15262f; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--teal); }
#person-adj { display: inline-flex; gap: 4px; align-items: center; color: var(--sub); font-size: 13px; } #person-adj[hidden] { display: none; } #person-adj button { padding: 4px 9px; }
button.primary { background: var(--teal); color: #052019; border-color: var(--teal); font-weight: 800; }
button[aria-pressed="false"] { opacity: .65; }

header { display: flex; align-items: center; gap: 22px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
#pg { font-size: 34px; font-weight: 900; color: var(--warm); letter-spacing: .04em; }
#ttl { font-size: 28px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { display: flex; align-items: baseline; gap: 14px; font-variant-numeric: tabular-nums; }
.time small { color: var(--sub); font-size: 14px; }
#left { font-size: 44px; font-weight: 900; } #left.warn { color: var(--warm); } #left.over { color: var(--bad); }
#elapsed, #clock { font-size: 22px; color: var(--sub); }
#bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #11222a; } #bar i { display: block; height: 100%; background: var(--teal); width: 0; }

main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr); gap: 18px; padding: 16px 22px; min-height: 0; }
.left { display: flex; flex-direction: column; min-height: 0; gap: 12px; }
.onscreen { display: flex; gap: 16px; align-items: flex-start; color: var(--sub); }
.onscreen .lbl { white-space: nowrap; }
.onscreen .lbl, #next .lbl, .notes b { font-size: 13px; font-weight: 800; color: var(--teal); letter-spacing: .08em; }
#screen-text { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
#screen-text li { padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; color: #cfe3df; }
#loop-note { font-size: 14px; color: var(--warm); }
#talk { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 18px 30px 4px; font-size: clamp(26px, 2.15vw, 40px); line-height: 1.75; font-weight: 600; }
#talk p { margin: 0 0 .8em; }
.notes { font-size: 15px; color: var(--sub); border-top: 1px solid var(--line); padding-top: 10px; }
.notes p { margin: 0 0 6px; } .notes b { margin-right: 10px; } .notes .pending b { color: var(--warm); }

.right { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
#preview { position: relative; flex: none; aspect-ratio: var(--proj-aspect, 16 / 9); max-height: 52vh; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; }
#preview iframe { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
#preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#preview .cap { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--sub); background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 6px; }
#next { padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
#next .nt { font-size: 22px; font-weight: 800; margin-top: 4px; } #next .nt b { color: var(--warm); margin-right: 10px; }
#next p { margin: 6px 0 0; color: var(--sub); font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls select { font: inherit; background: #15262f; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.status span { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); }
.status span[data-state="ok"] { color: var(--teal); border-color: rgba(127,227,196,.5); }
.status span[data-state="bad"] { color: var(--bad); border-color: rgba(255,123,123,.5); }
.aura-url { font-size: 13px; color: var(--sub); } .aura-url code { color: var(--ink); }

footer { border-top: 1px solid var(--line); }
#strip { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; scrollbar-width: thin; }
#strip button { flex: none; width: 150px; text-align: left; padding: 6px 10px; font-size: 12px; line-height: 1.3; color: var(--sub); }
#strip button b { display: block; color: var(--teal); font-size: 15px; }
#strip button span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#strip button.on { border-color: var(--warm); color: var(--ink); background: #22333a; } #strip button.on b { color: var(--warm); }
#strip button.past { opacity: .55; }

#screens { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 9; }
#screens[hidden] { display: none; }
#screens .box { width: min(640px, 90vw); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
#screens h2 { margin: 0 0 8px; font-size: 22px; } #screens .msg { color: var(--sub); margin: 0 0 14px; line-height: 1.6; }
#screens ul { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; } #screens ul button { width: 100%; text-align: left; padding: 14px; font-size: 18px; }
#fs-hint { position: fixed; right: 20px; bottom: 90px; z-index: 8; }
#fs-proj { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 10; padding: 22px 34px; font-size: 24px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
</style>
</head>
<body>
<header style="position:relative">
  <div id="bar"><i></i></div>
  <div id="pg"></div>
  <div id="ttl"></div>
  <div class="time"><small>残り</small><span id="left"></span><small>経過</small><span id="elapsed"></span><span id="clock"></span></div>
  <button data-act="timer"></button>
  <button data-act="reset">0に戻す</button>
  <button data-act="prev">←</button>
  <button data-act="next" class="primary">次へ →</button>
</header>
<main>
  <section class="left">
    <div class="onscreen"><span class="lbl">画面の文字</span><ul id="screen-text"></ul><span id="loop-note"></span></div>
    <div id="talk"></div>
    <div class="notes" id="notes"></div>
  </section>
  <section class="right">
    <div id="preview"><iframe src="projector.html?embed=1" title="投影の確認"></iframe><img id="preview-img" alt="" hidden><span class="cap">スクリーンに映っているもの</span></div>
    <div id="next"></div>
    <div class="controls">
      <button data-act="screen" class="primary">投影画面を選ぶ</button>
      <button data-act="fs">この画面を全画面</button>
      <button data-act="feed"></button>
      <button data-act="qr"></button>
      <button data-act="mirror"></button>
      <button data-act="cam"></button>
      <button data-act="rec" aria-pressed="false">録画する</button>
      <select id="cam-select" aria-label="カメラ"></select>
      <span id="person-adj" hidden>姿の位置：<button data-act="pa-left">←</button><button data-act="pa-right">→</button><button data-act="pa-up">↑</button><button data-act="pa-down">↓</button><button data-act="pa-big">大</button><button data-act="pa-small">小</button><button data-act="pa-reset">戻す</button></span>
    </div>
    <div class="status">
      <span id="st-proj"></span><span id="st-aura"></span><span id="st-sync"></span><span id="st-x"></span><span id="st-cam"></span><span id="st-rec" hidden></span>
    </div>
    <div class="aura-url">Auraで開く：<code id="aura-url"></code></div>
  </section>
</main>
<footer><nav id="strip"></nav></footer>
<div id="screens" hidden><div class="box"><h2>投影画面を選ぶ</h2><p class="msg"></p><ul></ul><button data-act="close-screens">閉じる</button></div></div>
<button id="fs-hint" class="primary" data-act="fs" hidden>この画面も全画面にする</button>
<button id="fs-proj" class="primary" data-act="fs-proj" hidden>スクリーンを全画面にする（Enter）</button>
<script src="content.js" charset="utf-8"></script>
<script src="content.local.js" charset="utf-8"></script>
<script>
  // 確認用の小さな投影：スクリーンと同じ縦横比で作り、枠の中に全体が収まるように縮める（はみ出さない）
  addEventListener("load", () => {
    const box = document.getElementById("preview"), f = box.querySelector("iframe");
    const fit = () => {
      const a = window.__projAspect || 16 / 9, W = 1600, H = Math.round(W / a);
      f.style.width = W + "px"; f.style.height = H + "px";
      const k = Math.min(box.clientWidth / W, box.clientHeight / H);
      f.style.transform = `translate(${(box.clientWidth - W * k) / 2}px, ${(box.clientHeight - H * k) / 2}px) scale(${k})`;
    };
    window.__fitPreview = fit;
    new ResizeObserver(fit).observe(box); fit();
  });
</script>
<script src="build/presenter.js" charset="utf-8"></script>
</body>
</html>
