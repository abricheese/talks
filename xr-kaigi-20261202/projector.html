<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR Kaigi 投影</title>
<style>
:root { --bg:#05090f; --ink:#eef7f5; --sub:#9db3b8; --teal:#7fe3c4; --warm:#ffc46b; --side: clamp(300px, 24vw, 460px);
  --font: "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","BIZ UDPGothic",Meiryo,sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
body { display: grid; grid-template-columns: 1fr 0; transition: grid-template-columns .6s ease; }
body.has-feed, body.has-qr { grid-template-columns: 1fr var(--side); }
body.cover.has-feed, body.cover.has-qr { grid-template-columns: 1fr 0; transition-delay: 0s; }
body.has-feed, body.has-qr { transition: grid-template-columns .9s ease .15s; }
body.cover #side { opacity: 0; transition-delay: 0s; } #side { transition: opacity .6s ease .7s; }
#stage { position: relative; overflow: hidden; min-width: 0; }
#stage .gl { position: absolute; inset: 0; }
#stage .css3d { pointer-events: none; }

/* ---- 空間の中の文字（CSS3D、1600×900 の板） */
.st { width: 1600px; height: 900px; position: relative; opacity: .32; transition: opacity .9s ease, filter .9s ease; filter: blur(1px); }
.st.on { opacity: 1; filter: none; }
.st.past { opacity: .2; }
.st-back .num { position: absolute; right: 40px; top: -60px; font-size: 560px; font-weight: 900; line-height: 1; color: transparent;
  -webkit-text-stroke: 3px rgba(127,227,196,.35); letter-spacing: -.04em; }
.st-main .no { position: absolute; left: 110px; top: 96px; font-size: 40px; font-weight: 800; color: var(--warm); letter-spacing: .08em; }
.st-main h2 { word-break: auto-phrase; text-wrap: balance; position: absolute; left: 106px; top: 150px; width: 1300px; margin: 0; font-size: 96px; line-height: 1.18; font-weight: 900; letter-spacing: .01em;
  text-shadow: 0 0 40px rgba(127,227,196,.25); }
.has-loop.st-main h2 { width: 1000px; }
.st-front ul { position: absolute; left: 150px; top: 440px; width: 1280px; margin: 0; padding: 0; list-style: none; }
.has-loop.st-front ul { width: 820px; }
.st-front li { word-break: auto-phrase; text-wrap: balance; width: fit-content; max-width: 100%; margin: 0 0 26px; padding: 22px 34px; font-size: 50px; line-height: 1.35; font-weight: 700; border-radius: 22px;
  background: linear-gradient(110deg, rgba(20,52,62,.85), rgba(10,24,32,.6)); border: 2px solid rgba(127,227,196,.35); box-shadow: 0 20px 60px rgba(0,0,0,.35);
  transform: translateX(-40px); opacity: 0; transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .8s; transition-delay: calc(var(--j) * .18s + .5s); }
.st-front.on li { transform: none; opacity: 1; }
.st-front.many ul { top: 410px; } .st-front.many li { margin-bottom: 14px; padding: 14px 28px; }
.st-loop.st-main h2 { left: 0; width: 1600px; text-align: center; top: 60px; font-size: 84px; }
.st-loop.st-main .no { left: 0; width: 1600px; text-align: center; top: 20px; }
.st-cover.st-main .event { position: absolute; left: 110px; top: 110px; font-size: 44px; font-weight: 800; color: var(--teal); letter-spacing: .12em; }
.st-cover.st-main h1 { position: absolute; left: 100px; top: 210px; width: 1400px; margin: 0; font-weight: 900; }
.st-cover.st-main h1 .big { display: block; font-size: 170px; line-height: 1.1; letter-spacing: .02em; text-shadow: 0 0 60px rgba(127,227,196,.35); }
.st-cover.st-main h1 .rest { display: block; margin-top: 30px; font-size: 58px; line-height: 1.3; color: #d9efe9; }
.st-cover.st-front .names { position: absolute; left: 110px; bottom: 90px; display: flex; gap: 60px; font-size: 54px; font-weight: 800; }
.st-cover.st-front .names span { padding: 12px 34px; border-radius: 999px; border: 2px solid rgba(255,196,107,.6); color: var(--warm); }
.st-cover.st-back .num, .st-loop.st-back .num, .has-loop.st-back .num { display: none; }
.st-photo { display: flex; gap: 30px; align-items: center; justify-content: flex-end; padding: 0 60px; }
.st-photo img { max-width: 760px; max-height: 620px; border-radius: 26px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.has-photo.st-front ul, .has-photo.st-main h2 { width: 760px; }
.cam3d { width: 440px; height: 580px; border-radius: 40px; overflow: hidden; border: 3px solid rgba(127,227,196,.7); box-shadow: 0 0 80px rgba(127,227,196,.35); background: #000; }
.cam3d video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

/* ---- 右の欄：QRとハッシュタグ付き投稿 */
#side { display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 22px 0; min-width: 0; overflow: hidden; }
#qr, #feed { background: rgba(14,30,38,.82); border: 1px solid rgba(127,227,196,.28); border-radius: 22px; }
#qr { display: none; align-items: center; gap: 16px; padding: 16px; }
.has-qr #qr { display: flex; }
#qr canvas { width: clamp(110px, 9vw, 170px); height: auto; border-radius: 10px; flex: none; }
#qr .tag { font-size: clamp(16px, 1.3vw, 28px); font-weight: 900; color: var(--teal); white-space: nowrap; }
#qr .hint { font-size: clamp(14px, 1vw, 18px); color: var(--sub); margin-top: 6px; }
#feed { display: none; flex: 1; min-height: 0; flex-direction: column; }
.has-feed #feed { display: flex; }
#feed h3 { margin: 0; padding: 14px 18px 8px; font-size: 18px; color: var(--sub); font-weight: 700; }
#feed ul { list-style: none; margin: 0; padding: 0 12px 12px; overflow-y: auto; flex: 1; scrollbar-width: none; display: flex; flex-direction: column; gap: 10px; }
.post { flex: none; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); animation: rise .6s ease; }
.post .who b { color: var(--teal); margin-right: 8px; font-size: 16px; } .post .who span { color: var(--sub); font-size: 13px; }
.post p { margin: 6px 0 0; font-size: clamp(16px, 1.15vw, 21px); line-height: 1.45; }
.post img { width: 100%; border-radius: 10px; margin-top: 8px; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }

/* ---- Aura ミラー */
#mirror { position: fixed; inset: 0; display: none; z-index: 5; background: #000; }
.mirror-on #mirror { display: block; }
#mirror canvas { width: 100%; height: 100%; display: block; }
#mirror .badge { position: absolute; left: 24px; top: 20px; padding: 8px 18px; border-radius: 999px; background: rgba(0,0,0,.55); color: var(--teal); font-weight: 800; font-size: 20px; }
#mirror .wait { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: var(--sub); }

#fs-ask { position: fixed; inset: 0; z-index: 10; border: 0; background: rgba(0,0,0,.6); color: #fff; font: 800 40px var(--font); cursor: pointer; }
.embed #side { padding-right: 10px; }
</style>
</head>
<body>
<main id="stage"></main>
<aside id="side">
  <section id="qr"><canvas></canvas><div><div class="tag"></div><div class="hint">スマホで読み取って投稿</div></div></section>
  <section id="feed"><h3>みんなの投稿</h3><ul></ul></section>
</aside>
<div id="mirror"><div class="badge">Auraの視界</div><div class="wait">Auraからの位置を待っています</div></div>
<button id="fs-ask" hidden>クリックで全画面にする</button>
<script src="content.js" charset="utf-8"></script>
<script src="content.local.js" charset="utf-8"></script>
<script src="build/projector.js" charset="utf-8"></script>
</body>
</html>
