<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地方も企業も ‐XRコミュニティを続ける工夫と生まれた変化‐ | XR Kaigi 2026</title>
<style>
:root { --bg:#060a10; --ink:#eef7f5; --sub:#9db3b8; --teal:#7fe3c4; --warm:#ffc46b;
  --font: "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
body { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden;
  background: radial-gradient(120% 80% at 80% 0%, #12303a 0%, transparent 60%), radial-gradient(90% 70% at 0% 100%, #1a2440 0%, transparent 60%), var(--bg); }
header { display: flex; justify-content: space-between; align-items: center; padding: max(12px, env(safe-area-inset-top)) 16px 8px; font-size: 14px; color: var(--sub); }
#tag { color: var(--teal); font-weight: 800; }
#card { perspective: 1200px; display: grid; place-items: center; padding: 8px 16px; min-height: 0; cursor: pointer; user-select: none; }
.card { width: 100%; max-width: 900px; max-height: 100%; overflow: auto; padding: clamp(20px, 5vw, 48px); border-radius: 26px;
  background: linear-gradient(150deg, rgba(22,52,62,.92), rgba(9,20,28,.9)); border: 1px solid rgba(127,227,196,.35);
  box-shadow: 0 40px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); transform: rotateX(4deg) rotateY(-6deg); transform-style: preserve-3d; position: relative; }
.card.in-next { animation: inNext .55s cubic-bezier(.2,.8,.2,1); } .card.in-prev { animation: inPrev .55s cubic-bezier(.2,.8,.2,1); }
@keyframes inNext { from { transform: translateX(40%) rotateY(-40deg); opacity: 0; } }
@keyframes inPrev { from { transform: translateX(-40%) rotateY(40deg); opacity: 0; } }
.card .no { position: absolute; right: 18px; top: -10px; font-size: clamp(80px, 22vw, 180px); font-weight: 900; color: transparent; -webkit-text-stroke: 2px rgba(127,227,196,.28); transform: translateZ(-40px); pointer-events: none; }
.card .event { color: var(--teal); font-weight: 800; letter-spacing: .1em; margin-bottom: 10px; }
.card h1 { word-break: auto-phrase; text-wrap: balance; margin: 0 0 18px; font-size: clamp(26px, 7vw, 54px); line-height: 1.25; font-weight: 900; transform: translateZ(30px); position: relative; }
.card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; transform: translateZ(50px); }
.card li { padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(127,227,196,.25); font-size: clamp(16px, 4.4vw, 26px); line-height: 1.45; font-weight: 700; }
.kind-cover li { display: inline-block; margin-right: 8px; color: var(--warm); border-color: rgba(255,196,107,.5); border-radius: 999px; }
.kind-cover ul { display: block; }
.card .diagram { color: var(--sub); font-size: 14px; text-align: center; margin: 8px 0 0; }
svg.loop { width: min(100%, 520px); display: block; margin: 16px auto 0; overflow: visible; }
.loop .ring { fill: none; stroke: rgba(127,227,196,.6); stroke-width: 1.2; }
.loop .dot { fill: #3b5560; } .loop .dot.on { fill: var(--warm); }
.loop text { font-size: 7px; fill: var(--sub); font-weight: 700; } .loop text.on { fill: var(--warm); }
nav { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; padding: 8px 16px; align-items: center; }
#pos { text-align: center; color: var(--sub); font-size: 14px; }
.bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 0 16px max(14px, env(safe-area-inset-bottom)); }
button { font: 700 15px var(--font); color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid rgba(127,227,196,.3); border-radius: 14px; padding: 13px 8px; }
#follow[aria-pressed="true"] { background: var(--teal); color: #052019; border-color: var(--teal); }
#prev, #next { font-size: 22px; padding: 8px; }
@media (orientation: landscape) and (max-height: 520px) { .card h1 { font-size: 28px; } .card li { font-size: 17px; padding: 8px 12px; } }
</style>
</head>
<body>
<header><span>XR Kaigi 2026</span><span id="tag"></span></header>
<section id="card" aria-live="polite"></section>
<div>
  <nav><button id="prev" aria-label="前へ">‹</button><div id="pos"></div><button id="next" aria-label="次へ">›</button></nav>
  <div class="bar"><button id="follow" aria-pressed="true">発表者に追従中</button><button id="save">画像を保存</button><button id="post">Xに投稿</button></div>
</div>
<script src="content.js" charset="utf-8"></script>
<script src="build/audience.js" charset="utf-8"></script>
</body>
</html>
